#### FRC Display thin-client preseed (Debian 13 / Trixie)
#
# Loaded automatically by the installer ISO via boot args:
#   auto=true priority=high preseed/file=/cdrom/preseed.cfg
#
# The hostname question is intentionally NOT preseeded so the installer stops
# and prompts for it. Everything else is auto-answered. After reboot, the
# frc-firstboot.service runs once and executes the standard install.sh from
# https://display.filipkin.com/install.sh, then disables itself.

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network
d-i netcfg/choose_interface select auto
# Hostname intentionally omitted so installer prompts.
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

### Mirror — proxied through home-server apt-cacher-ng so 6 fresh installs
### only fetch each package from the internet once. Proxy is removed at the
### end of firstboot.sh so off-LAN kiosks aren't dependent on 192.168.1.2.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string http://192.168.1.2:3142

### Account setup — root login only, no unprivileged user (display user is
### created later by install.sh).
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
# Temporary root password. Reset after deployment if you want SSH password
# auth (key auth via the authorized_keys injected below works regardless).
d-i passwd/root-password password frc-display-temp
d-i passwd/root-password-again password frc-display-temp

### Clock and time zone
d-i clock-setup/utc boolean true
d-i time/zone string America/Los_Angeles
d-i clock-setup/ntp boolean true

### Partitioning — auto-detect first disk, atomic recipe (single ext4 root + swap).
### early_command picks whichever physical disk shows up first so this works
### whether the SSD enumerates as /dev/sda or /dev/nvme0n1.
d-i partman/early_command string \
  USE=$(list-devices disk | head -n1); \
  debconf-set partman-auto/disk "$USE"; \
  debconf-set grub-installer/bootdev "$USE"
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Base / apt
d-i base-installer/install-recommends boolean false
d-i apt-setup/use_mirror boolean true
d-i apt-setup/services-select multiselect security, updates
popularity-contest popularity-contest/participate boolean false

### Tasks + minimum packages
tasksel tasksel/first multiselect ssh-server, standard
d-i pkgsel/include string curl ca-certificates sudo openssh-server
d-i pkgsel/upgrade select full-upgrade

### Bootloader
d-i grub-installer/only_debian boolean true

### Finish — power off instead of reboot, so the USB can be removed before
### the machine boots back up (some BIOSes prefer USB over the internal SSD).
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true

### Late command — drop firstboot files in place, persist apt proxy for the
### firstboot install.sh phase, seed root SSH key.
d-i preseed/late_command string \
  cp /cdrom/firstboot.sh /target/usr/local/sbin/frc-firstboot && \
  chmod 755 /target/usr/local/sbin/frc-firstboot && \
  cp /cdrom/firstboot.service /target/etc/systemd/system/frc-firstboot.service && \
  in-target systemctl enable frc-firstboot.service && \
  echo 'Acquire::http::Proxy "http://192.168.1.2:3142";' > /target/etc/apt/apt.conf.d/02-frc-proxy && \
  mkdir -p /target/root/.ssh && \
  chmod 700 /target/root/.ssh && \
  echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP6/d50L9jFHhb/EFLZOvgU9b7GH4RYblTLVWQ8vql5L filipkinjan@gmail.com' > /target/root/.ssh/authorized_keys && \
  chmod 600 /target/root/.ssh/authorized_keys
